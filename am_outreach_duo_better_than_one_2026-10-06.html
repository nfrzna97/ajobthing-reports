const CAMPAIGN="Duo is Better than One";
const GUIDELINE="https://drive.google.com/file/d/1iBl0TwfcA3CqFVf49OETBChO-7aFGnJt/view";

function buildMsg(am, w){
  const isShopping=w.code.includes('Shopping');
  if(isShopping)return `Dear ${w.company} 🎉\n\nCongrats! You're the winners from ${CAMPAIGN} campaign by AJobThing.\n\nHere's your reward: ${w.code}\n\nStay tuned for your reward details!\n\nThank you for being part of our campaign! 🙏`;
  return `Dear ${w.company} 🎉\n\nCongrats! You're the winners from ${CAMPAIGN} campaign by AJobThing.\n\nHere's your ZUS Coffee voucher code:\n\nCode: ${w.code}\n\nHow to redeem your voucher:\n- Open ZUS Coffee App\n- Tap Gift Card > Redeem\n- Enter your code\n\n📄 Full guideline is here: ${GUIDELINE}\n\nThanks so much for helping out!`;
}

function copyText(text){
  if(navigator.clipboard)return navigator.clipboard.writeText(text);
  const ta=document.createElement('textarea');
  ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
}

function copyAllOpen(am, btn){
  const msgs=am.winners.map(w=>buildMsg(am,w));
  const full=msgs.join('\n\n---\n\n');
  copyText(full).then(()=>{btn.textContent='✅ Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent=btn._orig;btn.classList.remove('ok')},2500)}).catch(()=>{});
  if(am.chat_url){setTimeout(()=>window.open(am.chat_url,'_blank'),100);}
}

function render(){
  const root=document.getElementById('cards');
  AMS.forEach((am,i)=>{
    const hasChat=!!am.chat_url;
    const rows=am.winners.map(w=>{
      const msg=buildMsg(am,w);
      const waText=encodeURIComponent(msg);
      return `<tr><td>${w.company}</td><td>${w.phone}</td><td><span class="badge">${w.code}</span></td><td><a class="wa" href="https://wa.me/${w.phone}?text=${waText}" target="_blank">WhatsApp</a></td></tr>`;
    }).join('');
    const btnLabel=hasChat?`💬📋 Copy &amp; Open Chat — ${am.name}`:`📋 Copy Message — ${am.name}`;
    const card=`<div class="card">
<div class="hdr"><div class="hdr-name">${am.name}<span class="cnt">${am.winners.length} winner${am.winners.length>1?'s':''}</span></div><div class="hdr-email">${am.email}</div></div>
<div class="btn-row">
<button class="btn btn-primary${hasChat?'':' no-chat'}" id="btn${i}" onclick="(function(el){el._orig=el.innerHTML;copyAllOpen(AMS[${i}],el)})(this)">${btnLabel}</button>
<button class="btn btn-secondary" onclick="(function(){const msgs=AMS[${i}].winners.map(w=>buildMsg(AMS[${i}],w));copyText(msgs.join('\\n\\n---\\n\\n')).then(()=>{})})()">Copy Only</button>
</div>
<table><thead><tr><th>Company</th><th>Phone</th><th>Code / Reward</th><th>WhatsApp</th></tr></thead><tbody>${rows}</tbody></table>
</div>`;
    root.insertAdjacentHTML('beforeend',card);
  });
}
render();
</script>
