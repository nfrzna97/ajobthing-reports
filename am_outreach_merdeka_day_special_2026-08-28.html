<script>
var DATA = JSON.parse(document.getElementById('am-data').textContent);

function clientMessageLines(company, code) {
  return [
    "Dear " + company + " 🎉",
    "",
    "Congrats! You're the winners from " + DATA.campaign + " campaign by AJobThing.",
    "",
    "Here's your " + DATA.reward + " voucher code:",
    "",
    "Code: " + code,
    "",
    "How to redeem your voucher:",
    "- Open " + DATA.rewardBrand + " App",
    "- Tap Gift Card > Redeem",
    "- Enter your code",
    "",
    "📄 Full guideline is here: https://bit.ly/AJT-how-to-redeem",
    "",
    "More surprises await - only for our followers!",
    "👉 Join our WhatsApp Channel: bit.ly/AJT-Channel",
    "",
    "Warm wishes,",
    "Admin AJobThing"
  ];
}

function waLink(phone, text) {
  return "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildAmLines(group) {
  var am = group.am, items = group.items;
  var lines;
  if (items.length === 1) {
    var it = items[0];
    lines = [
      "Hi " + am + ", due to an issue with my phone number, I need your help to send the " + DATA.campaign + " prize message to your client.",
      "Your customer " + it.company + " has won the " + DATA.reward + ". I've prepared a WhatsApp link with the message already pre-filled.",
      "",
      "What to do:",
      "1. Click the link below. It opens WhatsApp with a message already typed out to " + it.company + " (" + it.phone + ").",
      "2. Before sending, check that the company name and voucher code match: Code " + it.code + ".",
      "3. Send the message as-is (don't need to add anything).",
      "4. Reply here once it's sent, so we can mark it as completed.",
      "5. If the number I used turns out to be wrong, feel free to text the client at the correct number instead.",
      "WhatsApp link: " + it.link,
      "",
      "Thanks so much for helping out!"
    ];
  } else {
    lines = [
      "Hi " + am + ", due to an issue with my phone number, I need your help to send the " + DATA.campaign + " prize message to your clients.",
      "A few of your customers have won the " + DATA.reward + ". I've prepared a WhatsApp link for each company, and the message is already pre-filled.",
      "Just open the correct WhatsApp link, double-check the message, and send it to the customer. Each company has its own unique WhatsApp link.",
      "",
      "YOUR CUSTOMERS:"
    ];
    items.forEach(function(it, idx) {
      lines.push("");
      lines.push((idx+1) + ". " + it.company);
      lines.push("");
      lines.push("What to do:");
      lines.push("1. Click the link below. It opens WhatsApp with a message already typed out to " + it.company + " (" + it.phone + ").");
      lines.push("2. Before sending, check that the company name and voucher code match: Code " + it.code + ".");
      lines.push("3. Send the message as-is (don't need to add anything).");
      lines.push("4. Reply here once it's sent, so we can mark it as completed.");
      lines.push("5. If the number I used turns out to be wrong, feel free to text the client at the correct number instead.");
      lines.push("WhatsApp link: " + it.link);
    });
    lines.push("");
    lines.push("Thanks so much for helping out!");
  }
  return lines;
}

function legacyCopy(ta) {
  ta.style.display = 'block';
  ta.focus();
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  return ok;
}
function richSelectionCopy(htmlDiv) {
  try {
    var wasHidden = htmlDiv.style.display === 'none';
    htmlDiv.style.display = 'block';
    var range = document.createRange();
    range.selectNodeContents(htmlDiv);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = document.execCommand('copy');
    sel.removeAllRanges();
    if (wasHidden) htmlDiv.style.display = 'none';
    return ok;
  } catch (e) { return false; }
}
function richWriteCopy(ta, htmlDiv) {
  if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
    try {
      var htmlBlob = new Blob([htmlDiv.innerHTML], {type: 'text/html'});
      var textBlob = new Blob([ta.value], {type: 'text/plain'});
      return navigator.clipboard.write([new ClipboardItem({'text/html': htmlBlob, 'text/plain': textBlob})]).then(function() { return true; }).catch(function() { return false; });
    } catch (e) { return Promise.resolve(false); }
  }
  return Promise.resolve(false);
}
function tryAllCopy(taId, htmlId) {
  var ta = document.getElementById(taId);
  var htmlDiv = document.getElementById(htmlId);
  return richWriteCopy(ta, htmlDiv).then(function(ok) {
    if (ok) return true;
    if (richSelectionCopy(htmlDiv)) return true;
    return legacyCopy(ta);
  });
}
function copyMsg(taId, htmlId, btn) {
  var label = btn.textContent;
  var ta = document.getElementById(taId);
  tryAllCopy(taId, htmlId).then(function(ok) {
    btn.textContent = ok ? '✅ Copied!' : '⚠️ See box below';
    if (!ok) ta.style.display = 'block';
    setTimeout(function() { btn.textContent = label; }, 2400);
  });
}
function copyAndOpen(taId, htmlId, btn, chatUrl) {
  var label = btn.textContent;
  var ta = document.getElementById(taId);
  tryAllCopy(taId, htmlId).then(function(ok) {
    btn.textContent = ok ? '✅ Copied — chat opening...' : '⚠️ Copy failed, see box below';
    if (!ok) ta.style.display = 'block';
    setTimeout(function() { btn.textContent = label; }, 2600);
    window.open(chatUrl, '_blank');
  });
}

function render() {
  var totalWinners = 0;
  DATA.groups.forEach(function(g){ totalWinners += g.items.length; });
  document.getElementById('summary-line').textContent =
    "Generated 28 Aug 2026 · " + totalWinners + " winners across " + DATA.groups.length + " Account Managers · Reward: " + DATA.reward;

  var container = document.getElementById('cards');
  var html = '';

  DATA.groups.forEach(function(g, gi) {
    var taId = 'msg-' + gi;
    var htmlId = 'msgh-' + gi;

    g.items.forEach(function(it) {
      var text = clientMessageLines(it.company, it.code).join("\n");
      it.link = waLink(it.phone, text);
    });

    var lines = buildAmLines(g);
    var plainText = lines.join("\n");
    var htmlText = lines.map(function(ln) {
      if (ln.indexOf('WhatsApp link: ') === 0) {
        var url = ln.substring('WhatsApp link: '.length);
        return 'WhatsApp link: <a href="' + url + '" target="_blank" rel="noopener">Open WhatsApp ↗</a>';
      }
      return escapeHtml(ln);
    }).join('<br>');

    var primaryBtn, note = '';
    if (g.chatUrl) {
      primaryBtn = '<button class="btn btn-primary" onclick="copyAndOpen(\'' + taId + '\',\'' + htmlId + '\', this, \'' + g.chatUrl + '\')">💬📋 Copy Message &amp; Open Chat &mdash; ' + escapeHtml(g.am) + '</button>';
    } else {
      primaryBtn = '<button class="btn btn-primary" onclick="copyMsg(\'' + taId + '\',\'' + htmlId + '\', this)">📋 Copy Message to ' + escapeHtml(g.am) + '</button>';
      note = '<span class="no-link-note">chat link not ready</span>';
    }
    var secondaryBtn = '<button class="btn btn-secondary" onclick="copyMsg(\'' + taId + '\',\'' + htmlId + '\', this)">Copy Message</button>';

    var companyRows = g.items.map(function(it) {
      return '<div class="company-row"><div class="company-info"><span class="company-name">' + escapeHtml(it.company) +
        '</span><span class="company-meta">' + escapeHtml(it.phone) + ' &middot; Code ' + escapeHtml(it.code) +
        '</span></div><a class="mini-link" href="' + it.link + '" target="_blank" rel="noopener">Open WhatsApp ↗</a></div>';
    }).join('');

    html += '<div class="am-card">' +
      '<div class="am-card-header"><h2>' + escapeHtml(g.am) + '</h2>' +
      '<span class="winner-count">' + g.items.length + ' winner' + (g.items.length !== 1 ? 's' : '') + '</span>' +
      (g.email ? '<span class="am-email">' + escapeHtml(g.email) + '</span>' : '') +
      '</div>' +
      '<div class="btn-row">' + primaryBtn + secondaryBtn + note + '</div>' +
      '<textarea id="' + taId + '" readonly style="display:none;">' + escapeHtml(plainText) + '</textarea>' +
      '<div id="' + htmlId + '" style="display:none;">' + htmlText + '</div>' +
      '<div class="company-list">' + companyRows + '</div>' +
      '</div>';
  });

  container.innerHTML = html;
}
render();
</script>
