function buildClientMsg(w){
  return `Hi ${w.company}, 👋\n\nCongratulations 🎉 You are one of the winners of our ${CAMPAIGN} campaign.\n\n🎁 Your reward: ${REWARD}\n\nTo make sure you receive your reward without any hassle, kindly share us the details below :\n\nName:\nPhone:\n\nPlease make sure all the details are correct so we can proceed with the delivery soon.\n\nThank you, and congratulations again! 😊`;
}

function buildAMMsg(am){
  const n=am.winners.length;
  const waUrls=am.winners.map(w=>`https://wa.me/${w.phone}?text=${encodeURIComponent(buildClientMsg(w))}`);
  let lines=[];
  if(n===1){
    const w=am.winners[0];
    lines=[
      `Hi ${am.name}, due to an issue with my phone number, I need your help to send the ${CAMPAIGN} prize message to your client.`,
      `Your customer ${w.company} has won the ${REWARD}. I've prepared a WhatsApp link with the message already pre-filled.`,
      ``,
      `What to do:`,
      `1. Click the link below. It opens WhatsApp with a message already typed out to ${w.company} (${w.phone}).`,
      `2. Send the message as-is (don't need to add anything).`,
      `3. Reply here once it's sent, so we can mark it as completed.`,
      `4. If the number I used turns out to be wrong, feel free to text the client at the correct number instead.`,
      `WhatsApp link: ${waUrls[0]}`,
      ``,
      `Thanks so much for helping out!`
    ];
  } else {
    lines=[
      `Hi ${am.name}, due to an issue with my phone number, I need your help to send the ${CAMPAIGN} prize message to your clients.`,
      `A few of your customers have won the ${REWARD}. I've prepared a WhatsApp link for each company, and the message is already pre-filled.`,
      `Just open the correct WhatsApp link, double-check the message, and send it to the customer. Each company has its own unique WhatsApp link.`,
      ``,
      `YOUR CUSTOMERS:`
    ];
    am.winners.forEach((w,i)=>{
      lines.push(``);
      lines.push(`${i+1}. ${w.company}`);
      lines.push(``);
      lines.push(`What to do:`);
      lines.push(`1. Click the link below. It opens WhatsApp with a message already typed out to ${w.company} (${w.phone}).`);
      lines.push(`2. Send the message as-is (don't need to add anything).`);
      lines.push(`3. Reply here once it's sent, so we can mark it as completed.`);
      lines.push(`4. If the number I used turns out to be wrong, feel free to text the client at the correct number instead.`);
      lines.push(`WhatsApp link: ${waUrls[i]}`);
    });
    lines.push(``);
    lines.push(`Thanks so much for helping out!`);
  }
  const plain=lines.join('\n');
  const rich=lines.map((l,idx)=>{
    const waMatch=l.match(/^WhatsApp link: (https:\/\/wa\.me\/.+)$/);
    if(waMatch) return `WhatsApp link: <a href="${waMatch[1]}" target="_blank" rel="noopener">Open WhatsApp ↗</a>`;
    return l;
  }).join('<br>');
  return {plain,rich};
}

function legacyCopy(ta){
  ta.style.display='block';ta.focus();ta.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}return ok;
}
function richSelectionCopy(d){
  try{
    var was=d.style.display==='none';d.style.display='block';
    var r=document.createRange();r.selectNodeContents(d);
    var s=window.getSelection();s.removeAllRanges();s.addRange(r);
    var ok=document.execCommand('copy');s.removeAllRanges();
    if(was)d.style.display='none';return ok;
  }catch(e){return false;}
}
function richWriteCopy(ta,d){
  if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){
    try{
      var hb=new Blob([d.innerHTML],{type:'text/html'});
      var tb=new Blob([ta.value],{type:'text/plain'});
      return navigator.clipboard.write([new ClipboardItem({'text/html':hb,'text/plain':tb})]).then(()=>true).catch(()=>false);
    }catch(e){return Promise.resolve(false);}
  }
  return Promise.resolve(false);
}
function tryAllCopy(taId,htmlId){
  var ta=document.getElementById(taId),d=document.getElementById(htmlId);
  return richWriteCopy(ta,d).then(ok=>{if(ok)return true;if(richSelectionCopy(d))return true;return legacyCopy(ta);});
}
function copyMsg(taId,htmlId,btn){
  var label=btn.textContent,ta=document.getElementById(taId);
  tryAllCopy(taId,htmlId).then(ok=>{
    btn.classList.add('ok');btn.textContent=ok?'✅ Copied!':'⚠️ See box below';
    if(!ok)ta.style.display='block';
    setTimeout(()=>{btn.classList.remove('ok');btn.textContent=label;},2400);
  });
}
function copyAndOpen(taId,htmlId,btn,chatUrl){
  var label=btn.textContent,ta=document.getElementById(taId);
  tryAllCopy(taId,htmlId).then(ok=>{
    btn.classList.add('ok');btn.textContent=ok?'✅ Copied — opening chat...':'⚠️ Copy failed, see box below';
    if(!ok)ta.style.display='block';
    setTimeout(()=>{btn.classList.remove('ok');btn.textContent=label;},2600);
    window.open(chatUrl,'_blank');
  });
}
